name: Summer Health
description: 'Summer Health is a pediatric health company offering families fast, board-certified
  pediatric care. Its flagship consumer service provides comprehensive at-home blood work for children
  ages 8-18 (one blood draw covering 74 biomarkers) reviewed by board-certified pediatricians over video,
  alongside text-based urgent-care messaging with pediatric clinicians. The service is HSA/FSA eligible
  and LegitScript-approved. Summer Health is a consumer-facing telehealth offering and does not currently
  publish a public developer program, API documentation, or third-party integration surface. This
  profile was surfaced as a portfolio company of Lux Capital and enriched by the API Evangelist pipeline.'
